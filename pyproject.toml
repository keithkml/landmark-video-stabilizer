[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landmark-video-stabilizer"
version = "0.2.0"
description = "Landmark-guided, region-aware stabilization for difficult wildlife footage"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
landmark-stabilizer = "landmark_stabilizer.cli:main"
wobble-detector = "landmark_stabilizer.wobble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"landmark_stabilizer.wobble" = ["data/*.json"]
